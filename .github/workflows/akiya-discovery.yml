name: Akiya Content Discovery
on:
  workflow_dispatch:
  schedule:
    - cron: "15 22 * * *"
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/akiya-buyer-content-engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python akiya_content_engine/scripts/parse_iwate_town.py
      - run: python akiya_content_engine/scripts/build_candidates.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add akiya_content_engine/data/discovered_listings.csv akiya_content_engine/data/akiya_content_candidates.csv
          git diff --cached --quiet || git commit -m "Update discovered akiya candidates"
          git push
