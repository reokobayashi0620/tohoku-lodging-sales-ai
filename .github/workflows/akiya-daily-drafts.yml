name: Akiya Daily Draft Builder

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/akiya-daily-drafts.yml'
      - 'akiya_content_engine/scripts/**'
      - 'akiya_content_engine/config.json'
  schedule:
    - cron: "30 22 * * *"

permissions:
  contents: write

concurrency:
  group: akiya-daily-drafts
  cancel-in-progress: false

jobs:
  build-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover Iwate listings
        run: python akiya_content_engine/scripts/run_source.py iwate
      - name: Discover Aomori listings
        run: python akiya_content_engine/scripts/run_source.py aomori
      - name: Discover Miyagi listings
        run: python akiya_content_engine/scripts/run_source.py miyagi
      - name: Discover Akita listings
        run: python akiya_content_engine/scripts/run_source.py akita
      - name: Discover Yamagata listings
        run: python akiya_content_engine/scripts/run_source.py yamagata
      - name: Discover Fukushima listings
        run: python akiya_content_engine/scripts/run_source.py fukushima
      - name: Merge discovery feeds
        run: python akiya_content_engine/scripts/merge_discovery.py
      - name: Build candidates
        run: python akiya_content_engine/scripts/build_candidates.py
      - name: Build SEO property pages
        run: python akiya_content_engine/scripts/build_site.py
      - name: Generate social drafts
        run: python akiya_content_engine/scripts/generate_social_drafts.py
      - name: Publish generated site at Pages root
        run: |
          cp docs/index.html index.html
          rm -rf properties prefectures
          cp -R docs/properties properties
          cp -R docs/prefectures prefectures
          cp docs/sitemap.xml sitemap.xml
          cp docs/robots.txt robots.txt
      - name: Save generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add akiya_content_engine/data akiya_content_engine/output docs index.html properties prefectures sitemap.xml robots.txt
          git diff --cached --quiet || git commit -m "Build daily akiya buyer content [skip ci]"
          git push origin HEAD:main
