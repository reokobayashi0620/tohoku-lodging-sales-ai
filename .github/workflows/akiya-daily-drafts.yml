name: Akiya Daily Draft Builder
on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * *"
permissions:
  contents: write
jobs:
  build-drafts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/akiya-buyer-content-engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover supported public listings
        run: python akiya_content_engine/scripts/parse_iwate_town.py
      - name: Discover Hirosaki-area public listings
        run: python akiya_content_engine/scripts/parse_hirosaki_area.py
      - name: Discover Ishinomaki public listings
        run: python akiya_content_engine/scripts/parse_ishinomaki.py
      - name: Discover Kazuno public listings
        run: python akiya_content_engine/scripts/parse_kazuno.py
      - name: Discover Nagai public listings
        run: python akiya_content_engine/scripts/parse_nagai.py
      - name: Merge discovery feeds
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          root=Path("akiya_content_engine/data")
          files=[root/"discovered_listings.csv",root/"discovered_listings_hirosaki.csv",root/"discovered_listings_ishinomaki.csv",root/"discovered_listings_kazuno.csv",root/"discovered_listings_nagai.csv"]
          rows=[]; fields=[]
          for p in files:
              if not p.exists(): continue
              with p.open(encoding="utf-8") as fh:
                  r=csv.DictReader(fh)
                  if not fields: fields=r.fieldnames or []
                  rows.extend(list(r))
          if fields:
              with (root/"discovered_listings.csv").open("w",newline="",encoding="utf-8") as fh:
                  w=csv.DictWriter(fh,fieldnames=fields,extrasaction="ignore"); w.writeheader(); w.writerows(rows)
          print(f"Merged {len(rows)} discovered listing rows")
          PY
      - name: Deduplicate candidates
        run: python akiya_content_engine/scripts/build_candidates.py
      - name: Generate approved social drafts
        run: python akiya_content_engine/scripts/generate_social_drafts.py
      - name: Save generated data and drafts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add akiya_content_engine/data/discovered_listings.csv \
                  akiya_content_engine/data/discovered_listings_hirosaki.csv \
                  akiya_content_engine/data/discovered_listings_ishinomaki.csv \
                  akiya_content_engine/data/discovered_listings_kazuno.csv \
                  akiya_content_engine/data/discovered_listings_nagai.csv \
                  akiya_content_engine/data/akiya_content_candidates.csv \
                  akiya_content_engine/output/social_drafts.md
          git diff --cached --quiet || git commit -m "Build daily akiya social drafts"
          git push
