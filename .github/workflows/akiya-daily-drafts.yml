name: Akiya Daily Draft Builder

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/akiya-daily-drafts.yml'
      - 'akiya_content_engine/scripts/**'
      - 'akiya_content_engine/config.json'
  schedule:
    - cron: "30 22 * * *"

permissions:
  contents: write

concurrency:
  group: akiya-daily-drafts
  cancel-in-progress: false

jobs:
  build-drafts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover Iwate listings
        continue-on-error: true
        run: python akiya_content_engine/scripts/parse_iwate_town.py
      - name: Discover Aomori listings
        continue-on-error: true
        run: python akiya_content_engine/scripts/parse_hirosaki_area.py
      - name: Discover Miyagi listings
        continue-on-error: true
        run: python akiya_content_engine/scripts/parse_ishinomaki.py
      - name: Discover Akita listings
        continue-on-error: true
        run: python akiya_content_engine/scripts/parse_kazuno.py
      - name: Discover Yamagata listings
        continue-on-error: true
        run: python akiya_content_engine/scripts/parse_nagai.py
      - name: Discover Fukushima listings
        continue-on-error: true
        run: python akiya_content_engine/scripts/parse_date_fukushima.py
      - name: Merge discovery feeds
        run: python akiya_content_engine/scripts/merge_discovery.py
      - name: Build candidates
        run: python akiya_content_engine/scripts/build_candidates.py
      - name: Build SEO property pages
        run: python akiya_content_engine/scripts/build_site.py
      - name: Generate social drafts
        run: python akiya_content_engine/scripts/generate_social_drafts.py
      - name: Save generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add akiya_content_engine/data akiya_content_engine/output docs
          git diff --cached --quiet || git commit -m "Build daily akiya buyer content [skip ci]"
          git push origin HEAD:main
