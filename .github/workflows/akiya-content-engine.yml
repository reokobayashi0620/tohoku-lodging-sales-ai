name: Akiya content draft check
on:
  workflow_dispatch:
  push:
    paths:
      - 'akiya_content_engine/**'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile akiya_content_engine/scripts/generate_social_drafts.py
