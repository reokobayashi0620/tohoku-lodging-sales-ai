name: Akiya site build
on:
  workflow_dispatch:
  push:
    paths:
      - 'akiya_content_engine/**'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile akiya_content_engine/scripts/build_site.py akiya_content_engine/scripts/generate_social_drafts.py
      - name: Build SEO site
        run: python akiya_content_engine/scripts/build_site.py
      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Regenerate Akiya SEO site"
            git push
          fi
